[package]
name = "eave-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
serde_json = "1"
libc = "0.2"
async-trait = "0.1"
thiserror = "2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"
