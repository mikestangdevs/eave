[package]
name = "eave-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
plist = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "fake-agent"
path = "src/bin/fake_agent.rs"

[[bin]]
name = "fake-hermes"
path = "src/bin/fake_hermes.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"

[[bin]]
name = "engine-stub"
path = "src/bin/engine_stub.rs"
